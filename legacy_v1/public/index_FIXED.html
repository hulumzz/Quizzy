    const compressImage = (file, maxWidth = 800, quality = 0.7) => {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
                };
                img.onerror = (err) => reject(err);
            };
            reader.onerror = (err) => reject(err);
        });
    };
    
    // ✅ FIX: Upload dengan Timeout
    const uploadImage = async (file) => {
        try {
            const compressedBlob = await compressImage(file, 800, 0.7);
            const f = new FormData();
            f.append("image", compressedBlob, "upload.jpg");

            const btn = document.querySelector('button[onclick*="handleImg"]');
            const originalText = btn ? btn.innerHTML : '';
            if(btn) btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            // ✅ TIMEOUT CONTROLLER
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), UPLOAD_TIMEOUT_MS);

            const r = await fetch(UPLOAD_WORKER_URL, {
                method: "POST",
                body: f,
                signal: controller.signal
            });

            clearTimeout(timeoutId);
            if(btn) btn.innerHTML = originalText;

            if (!r.ok) throw new Error("Gagal koneksi ke server upload");

            const d = await r.json();
            
            if (d.success) {
                return d.url;
            } else {
                throw new Error(d.error || "Gagal mendapatkan URL");
            }

        } catch (e) {
            console.error("Upload Error:", e);
            
            if (e.name === 'AbortError') {
                notify("Timeout", "Upload terlalu lama. Coba lagi dengan gambar lebih kecil.", "warning");
            } else {
                notify("Gagal Upload", "Periksa koneksi internet atau coba lagi.", "error");
            }
            
            const btn = document.querySelector('button[onclick*="handleImg"]');
            if(btn && !btn.innerHTML.includes('Upload')) {
                btn.innerHTML = '<i class="fa-solid fa-plus"></i> Upload';
            }
            
            return null;
        }
    };

            startTimer: (elId, durationSeconds, serverStartTime) => {
                const el = document.getElementById(elId);
                if(!el || !serverStartTime) return;
                
                el.style.transition = 'none';
                const startMs = serverStartTime.toDate().getTime();
                const endMs = startMs + (durationSeconds * 1000);
                
                const update = () => {
                    const now = Date.now();
                    const remaining = endMs - now;
                    const pct = Math.max(0, (remaining / (durationSeconds * 1000)) * 100);
                    el.style.width = pct + "%";
                    
                    if (pct < 25) {
                        el.className = 'h-full w-full bg-red-500 shadow-[0_0_15px_rgba(239,68,68,0.8)]';
                    } else if (pct < 50) {
                        el.className = 'h-full w-full bg-yellow-400';
                    } else {
                        el.className = 'h-full w-full bg-gradient-to-r from-blue-400 to-purple-600';
                    }
                    
                    if (remaining > 0 && document.getElementById(elId)) {
                        requestAnimationFrame(update);
                    }
                };
                
                requestAnimationFrame(update);
            }

            // ✅ FIX: Rate limiting
            generate: async () => {
                // ✅ Guard: Prevent spam
                if (app.ai.isGenerating) {
                    notify("Tunggu", "AI masih memproses request sebelumnya.", "info");
                    return;
                }
                
                app.ai.isGenerating = true;
                
                const subjectSelect = document.getElementById('ai-subject');
                let subject = subjectSelect.value;
                if (subject === 'Lainnya') {
                    subject = document.getElementById('ai-custom-subject').value.trim();
                }
                
                const level = document.getElementById('ai-level').value;
                const count = document.getElementById('ai-count').value;
                const difficulty = document.querySelector('input[name="ai_diff"]:checked').value;
                const extraInst = document.getElementById('ai-prompt').value;

                if (!subject) {
                    app.ai.isGenerating = false;
                    return notify("Data Kurang", "Pilih atau isi mata pelajaran dulu.", "warning");
                }

                const btn = document.getElementById('btn-ai-generate');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xl"></i> SEDANG BERPIKIR...';
                btn.disabled = true;

                const prompt = `
                    Buatkan ${count} soal pilihan ganda (Multiple Choice) untuk mata pelajaran ${subject}.
                    Target siswa: ${level}.
                    Tingkat kesulitan: ${difficulty}.
                    ${extraInst ? `Instruksi tambahan: ${extraInst}` : ''}

                    Format Output WAJIB JSON Array murni tanpa markdown, tanpa teks pembuka/penutup.
                    Struktur JSON harus persis seperti ini:
                    [
                        {
                            "text": "Pertanyaan disini",
                            "options": ["Pilihan A", "Pilihan B", "Pilihan C", "Pilihan D"],
                            "correctIndex": 0 
                        }
                    ]
                    Catatan: 
                    - "correctIndex" adalah angka 0-3 (0=A, 1=B, 2=C, 3=D).
                    - Pastikan jawaban benar terdistribusi acak, jangan A semua.
                    - Bahasa Indonesia yang baku dan edukatif.
                `;

                try {
                    const apiKey = app.ai.getKey();
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${apiKey}`;

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });

                    if (!response.ok) throw new Error("Gagal menghubungi server AI");

                    const data = await response.json();
                    let rawText = data.candidates[0].content.parts[0].text;

                    rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();

                    const questions = JSON.parse(rawText);

                    if (Array.isArray(questions)) {
                        questions.forEach(q => {
                            if (q.text && Array.isArray(q.options) && q.options.length === 4) {
                                app.studio.renderQuestionItem({
                                    type: 'multiple_choice',
                                    text: q.text,
                                    options: q.options,
                                    correctIndex: q.correctIndex || 0
                                });
                            }
                        });

                        document.getElementById('modal-ai').classList.remove('open');
                        notify("Magic!", `Berhasil membuat ${questions.length} soal otomatis.`, "success");
                        
                        const titleInput = document.getElementById('edit-title');
                        if (!titleInput.value) {
                            titleInput.value = `Kuis ${subject} (${difficulty})`;

                        document.getElementById('edit-level').value = level.includes('SD')?'SD':level.includes('SMP')?'SMP':level.includes('SMA')?'SMA':'UMUM';

                    } else {
                        throw new Error("Format AI tidak valid.");
                    }

                } catch (error) {
                    console.error("AI Error:", error);
                    notify("Gagal", "AI sedang sibuk atau error parsing. Coba lagi!", "error");

                    btn.disabled = false;

                for (let i = 0; i < sessionStorage.length; i++) {

                    }

                    return notify("Gagal", "PIN tidak ditemukan.", "error");

                const gameData = g.data();

                    return notify("Error", "Data game tidak valid.", "error");

                app.student.pin = pin;
                app.student.name = name;
                
                sessionStorage.setItem('last_pin', pin);
                sessionStorage.setItem('last_name', name);

                        app.student.quizData = qDoc.data();
                        app.student.preloadImages();
                    }
                }
                
                await setDoc(doc(db, `artifacts/${appInfo.id}/public/data/quizzy`, pin, 'players', app.student.myID), {

                    score: 0

                document.getElementById('st-initial').innerText = name.substr(0,1).toUpperCase();
                document.getElementById('st-name').innerText = name;

                                console.error("Error loading summary:", e);

                            const seqEl = document.getElementById('seq-container');
                            if (seqEl) seqEl.innerHTML = '';
                        }
                        
                        if(g.status === 'lobby' || g.status === 'starting') {
                            document.getElementById('v-wait').classList.remove('hidden');
                        }
                        else if(g.status === 'playing') {
                            const alreadyAnswered = sessionStorage.getItem(`ans_${g.currentQ}_${app.student.myID}`);
                            
                            if(alreadyAnswered || app.student.isSubmitting) {
                                document.getElementById('v-sent').classList.remove('hidden');
                            } else {
                                // ✅ NULL CHECK untuk question
                                if (!app.student.quizData || !app.student.quizData.questions) {
                                    log("Quiz data not loaded");
                                    return;
                                }
                                
                                const q = app.student.quizData.questions[g.currentQ];
                                if (!q) {
                                    log("Question not found:", g.currentQ);
                                    return;
                                }
                                
                                const dur = g.qDuration || 20;
                                if (g.startTime) {
                                    app.utils.startTimer('st-timer', dur, g.startTime);
                                }
                                
                                // Render question based on type
