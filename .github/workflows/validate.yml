name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix workers
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Test frontend runtime contracts
        run: npm run test:frontend
      - name: Test backend
        run: npm run test:backend
      - name: Test Worker
        run: npm run test:workers
      - name: Check backend syntax
        run: npm run check:backend
      - name: Check whitespace
        run: git diff --check
